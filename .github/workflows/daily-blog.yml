name: Daily Engineering Blog Publisher

on:
  schedule:
    # Runs daily at 6:00 PM PKT (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure headless browser is available
        run: |
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then
            npx playwright-core install chromium
          fi

      - name: Generate daily blog post, diagram cover, and static SEO pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate

      - name: Commit and push published post to main
        run: |
          git config user.name "Muhammad Ghufran Naseer"
          git config user.email "86355241+GhufranNaseer@users.noreply.github.com"

          git add data/posts.json blog/ sitemap.xml robots.txt

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          COMMIT_MSG=$(node -e '
            const fs = require("fs");
            const meta = JSON.parse(fs.readFileSync(".last-commit-meta.json", "utf8"));
            const lines = [
              `feat(blog): publish "${meta.title}"`,
              "",
              `- Category: ${meta.category}`,
              `- Slug: ${meta.slug}`,
              `- Reading time: ${meta.readingTime}`,
              `- Assets: generated cover diagram (${meta.coverImage}) & static SEO page`,
              "- Feeds: updated data/posts.json, blog/index.html, and sitemap.xml"
            ];
            process.stdout.write(lines.join("\n"));
          ')

          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main
          git push origin main
